name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release versions
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Release tags must use vMAJOR.MINOR.PATCH, for example v1.1.0.' >&2
            exit 1
          }
          version="${RELEASE_TAG#v}"
          for manifest in package.json plugins/soft-skills/{.claude-plugin,.codex-plugin}/plugin.json; do
            manifest_version="$(jq -er '.version' "$manifest")"
            [[ "$manifest_version" == "$version" ]] || {
              printf '%s declares %s, but the release tag requires %s.\n' "$manifest" "$manifest_version" "$version" >&2
              exit 1
            }
          done

      - name: Set up npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # A rerun after a failed GitHub release step finds this version already published.
      - name: Publish the Pi package to npm
        shell: bash
        run: |
          npm view "soft-skills@${RELEASE_TAG#v}" version >/dev/null 2>&1 || npm publish --provenance --access public

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Soft Skills $RELEASE_TAG" \
            --generate-notes \
            --notes "Install instructions for Claude Code, Codex, and Pi: [README](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/README.md#install)."
